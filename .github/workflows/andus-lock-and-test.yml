name: ANDUS locked dependencies and build
on:
  push:
    branches: [upgrade/andus-green-security-2026-11]
    paths:
      - package.json
      - .github/workflows/andus-lock-and-test.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Resolve lockfile for approved Supabase library
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install and build full application
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit reviewed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock verified Supabase client dependency for ANDUS"
            git push origin HEAD:upgrade/andus-green-security-2026-11
          fi
