name: Recover verified ANDUS media
on:
  push:
    branches:
      - upgrade/andus-green-security-2026-11
    paths:
      - .github/workflows/andus-media-recovery.yml
permissions:
  contents: write
jobs:
  restore-media:
    if: github.repository == 'sescowem-bot/Andus-international' && github.ref == 'refs/heads/upgrade/andus-green-security-2026-11'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install patched dependencies
        run: npm ci --no-audit --no-fund
      - name: Safely re-encode allowlisted legacy media
        run: node scripts/import-andus-media.mjs
      - name: Verify full output and push images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/andus-original.webp public/images/company/*.webp public/images/divisions/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Restore original ANDUS imagery as verified offline WebP assets"
            git push origin HEAD:upgrade/andus-green-security-2026-11
          fi
